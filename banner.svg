```svg
<svg width="1200" height="400" viewBox="0 0 1200 400"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020303"/>
      <stop offset="45%" stop-color="#07100d"/>
      <stop offset="100%" stop-color="#010101"/>
    </linearGradient>

    <!-- Hacker Green -->
    <linearGradient id="greenText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#00ff9c"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="greenGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <!-- Grid -->
    <pattern id="grid" width="40" height="40"
             patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40"
            fill="none"
            stroke="#00ff9c"
            stroke-opacity=".035"/>
    </pattern>

    <!-- Scanlines -->
    <pattern id="scanlines"
             width="4"
             height="8"
             patternUnits="userSpaceOnUse">
      <rect width="4" height="1"
            fill="#00ff9c"
            opacity=".025"/>
    </pattern>

    <!-- Moving beam -->
    <linearGradient id="beam"
                    x1="0" y1="0"
                    x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff9c" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ff9c" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#00ff9c" stop-opacity="0"/>
    </linearGradient>

    <!-- Glitch Clip -->
    <clipPath id="glitchClip">
      <rect x="0" y="145" width="1200" height="70"/>
    </clipPath>

  </defs>


  <!-- ================= BACKGROUND ================= -->

  <rect width="1200" height="400"
        fill="url(#bg)"/>

  <rect width="1200" height="400"
        fill="url(#grid)"/>

  <rect width="1200" height="400"
